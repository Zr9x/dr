
name: Build jar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - run: cd donut-hud-1.21.11-source\ \(1\)/donut-hud && gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: donut-hud-jar
          path: donut-hud-1.21.11-source\ \(1\)/donut-hud/build/libs/*.jar
